  T5.5:
    name: Two `truncate` helpers; the status CLI one can panic
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`truncate("é".repeat(20), 24)` must not panic and'
    - must return valid UTF-8.
    - 'ENT-005 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-005 (P2). Status: observed fact (panic); inference (operator impact). `&str` indexing panics if `max-1` is mid-character. Target IDs are strings with no charset constraint in `schema.rs`. A 25+-byte ID whose byte 23 is mid-UTF-8 crashes `crosshair status`. The store path already solved this; the copies drifted. Remediation: one helper (or `chars().take()`), used by status and store; add a multibyte test. Blast: status CLI only; tick/store path is safe. Typical bullseye IDs (`T1`, `T4`) are ASCII and will not trip it. Report: docs/audits/entropy-audit-2026-08-22.md.'
