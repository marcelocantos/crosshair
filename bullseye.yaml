  T5.1:
    name: Cron due-ness is a current-minute sample with catch-up
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '(1) unit: `needs_attempt` at 02:30 with'
    - '`cron:0 2 * * *` and `last_attempt_at` yesterday still returns true'
    - 'after catch-up; (2) loop: a fake clock advancing 30m steps from an'
    - 08:17 start must still fire `0 2 * * *` once that day. The current
    - tests would stay green without (2).
    - 'ENT-001 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-001 (P1). Status: observed fact. with `--tick 30m`, ticks fire at `start, start+30m, …`. Hitting minute `02:00` requires the daemon’s start phase to land in that minute. launchd `RunAtLoad` / `KeepAlive` restart time is not aligned to cron. Independently, a sequential attempt whose timeout defaults to 5 minutes (`src/runner.rs:28-29`) can push the next tick past the matching minute even when `--tick` is `30s`. Missed windows wait until the expression matches again (tomorrow, for a daily cron). `every:` is unaffected because… Remediation: evaluate cron as “a matching instant exists in `(last_attempt_at, now]`” (croner’s next/prev fire), still once per matching minute. Until that lands, fail or warn when `--tick` > 1m and any loaded strategy is `cron:`, and change the launchd sample to `30s` (or `1m`). Blast: every `cron:` strategy under the documented launchd command line; T2’s original consumer (scheduled ingest that must not run every tick) is the use case this code was added for. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-001
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T5.10:
    name: Bullseye schema is an unversioned subset; `schema_version` is unread
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - 'loading `schema_version: 1` with a known-incompatible'
    - shape fails loudly.
    - 'ENT-010 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-010 (P3). Status: observed fact (unread field); inference (cross-repo drift). a bullseye rename or semantic change of `strategy.*` or `status` can load “successfully” with wrong defaults (`Status` defaults to `Identified`, which is runnable). There is no contract test against bullseye’s schema crate/file (and this audit did not open that repo). Remediation: define a supported `schema_version` range and warn/fail outside it; add a fixture copied from a frozen bullseye example (vendored, version-pinned). Blast: every loaded YAML; grows with bullseye releases. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-010
    - p3
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
