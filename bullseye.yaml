  T5.3:
    name: '`retry` is a second, unread, backoff authority'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - if rejected, a fixture with `retry:` fails load; if
    - honored, changing `max_attempts` changes `next_cooldown` in a test.
    - 'ENT-003 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-003 (P2). Status: observed fact. YAML authors can write `max_attempts: 5` / `backoff: exponential` and observe a different schedule. Two sources of truth for the same policy; they can (and do) disagree. The field is not dead in the schema, so it will not fail clippy. Remediation: either honor `retry` (even a reduced subset) or stop deserializing it and reject unknown `strategy.retry` until implemented. Do not keep a parsed no-op. Blast: every strategy that sets `retry`; future readers of bullseye YAML who assume the nested block is executable. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
