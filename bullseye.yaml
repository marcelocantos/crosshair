    context: 'Entropy-audit ENT-007 (P2). Status: observed fact. a PR that edits `Cargo.toml` without refreshing `Cargo.lock` still goes green on `master` CI (cargo may resolve on the runner). The published artifact job then fails or, worse, if someone ships without the release job, the lockfile is not the build input. Supply-chain review of `Cargo.lock` is not a PR gate. Remediation: add `--locked` to CI clippy/test (fmt does not need it). Mirror on `make bullseye`. Blast: every PR; release job is the backstop for tags. Report: docs/audits/entropy-audit-2026-08-22.md.'
