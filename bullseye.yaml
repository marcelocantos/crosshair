    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T5.6:
    name: One unreadable config aborts every config for the tick
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - two temp YAMLs, second invalid, `--once` still
    - records an attempt for the first.
    - 'ENT-006 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-006 (P2). Status: observed fact. `--config a.yaml --config b.yaml` with a transient permission/parse error on `a.yaml` starves `b.yaml` until the next successful load. A persistent parse error disables the whole daemon loop without running the still-valid file. Remediation: per-file error isolation in `load_strategy_targets` (or in `run_one_tick`): emit a warning, keep targets from files that loaded. Blast: multi-file deployments (CLI documents repeatable `-c`). Single-file setups fail closed, which may be desired. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
