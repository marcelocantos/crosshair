    - 'ENT-002 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-002 (P2). Status: observed fact. `timeout: 2min` / `2 minutes` / `2` is accepted as 5m. Operators believe they tightened the hang ceiling; the 9.5h-hang class of bug this daemon exists to bound is only bounded at the default. Remediation: `bail!` (or a traced error that skips the target) on parse failure, same as `--tick` and bad cron. Blast: every strategy with a malformed timeout string. Report: docs/audits/entropy-audit-2026-08-22.md.'
